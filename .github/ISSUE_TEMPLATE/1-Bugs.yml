name: Bug 反馈
description: 出现报错、异常反应等现象，在这里报告一个 Bug。
title: "[BUG] "
labels: ["Bug", "New"]
body:
  - type: markdown
    attributes:
    value: |
      [EXAMPLE]
      感谢您反馈 TurrisEburnea 的 Bug！请认真填写以下 Issue 表单，确保信息准确无误，便于开发者迅速定位并修复 Bug。

      请在上方的标题栏填写一个能够清晰概括你所遇到的问题的短句，方便我们快速了解你的问题。

      > [!WARNING]
      > 
      > 不要提交**无意义的**与**重复的** Issue。这些没有帮助的 Issue 可能会被在不加说明的情况下被无条件关闭，甚至可能导致你的 GitHub 账户被本仓库 / 组织封禁。

      > [!NOTE]
      > 
      > 遇到了多个问题？建议分别提交它们，而不是把它们放在同一个 Issue 中。
  - type: checkboxes
    id: checklist
    attributes:
      label: 检查项目
      description: 在提交 Issue 前，请完成这些项目。盲目地把它当成 EULA 全选可能导致你的 Issue 在不加说明的情况下被无条件关闭，甚至导致你的 GitHub 账户被本仓库 / 组织封禁。
      options:
        - label: 我已经在 [Issues](https://github.com/MacroMeng/TurrisEburneaTemplate/issues?q=type%3ABug) 中检索过，确保没有相似的 Issue 已经被提交。
          required: true
        - label: 我已经检查过最新的 [提交信息](https://github.com/MacroMeng/TurrisEburneaTemplate/[REPALCE][BRANCH NAME]/commits)，并确认了这个问题还没有被较新的提交修复。
          required: false
        - label: 我通读了 [常见问题]([REPLACE][FAQs URI])，确保它没有已供的解决方案。
          required: true
        - label: 我仔细阅读了选项中的内容，完成了所有应该被完成的检查项目，并已知晓这个选项不需要勾选。
          required: false
        - label: 我已经在 [Discussion](https://github.com/MacroMeng/TurrisEburneaTemplate/discussions) 中搜索过，确保这个问题没有被提起过。
          required: false
        - label: 我已了解开发者可能不会很快回复这个 Issue，或将其搁置很久。
          required: true
        - label: 我通读了本项目开源许可，并已知晓开发者并没有修复所有 Bug 的义务。如果你等不及，请自行 [Fork](https://github.com/MacroMeng/TurrisEburneaTemplate/fork)
  - type: markdown
    attributes:
    value: |
      ## 提供信息

      请以尽可能详细的文字，对应下方各个版块，描述你所遇到的问题。你提供的有效信息越多，开发者就能更快速、更高效地解决你所遇到的问题。

      如果可以，请附上截图或录屏，以方便我们分析问题。

      > [!NOTE]
      >
      > 在**上传附件、图片**等外部资源时：
      > 
      > - 尽可能使用 GitHub 上传，如你可以使用 Ctrl (macOS 为 Command) V 粘贴剪贴板的文档；
      > - 或者直接将文件拖动到文本框内上传；
      > - 要提交多个相关性高的文件，请使用压缩工具压缩为常见格式一并发送；
      > - 在上传提示（`<!--Uploading XXX--->`）没有变为正式 Markdown 引用（如图片为 `![XXX](XXX)`）前，不要提交。
      > - 不要使用不登录 / 不使用客户端无法下载分享文件的云盘服务，这些附件很可能不会被看到。
  - type: textarea
    attributes:
      label: 预期行为
      description: 这个项目应该按照什么样子工作？
      placeholder: 这个项目在……时，应该……
    validations:
      required: true
  - type: textarea
    attributes:
      label: 实际结果
      description: 这个项目现在如何工作？
      placeholder: 在……时，发生了……
    validations:
      required: true
  - type: textarea
    attributes:
      label: 复现步骤
      description: 如何触发这个问题？
      placeholder: |
        1. 首先，……
        2. 随后，……
        3. ……
        4. 触发 Bug。
    validations:
      required: true
  - type: upload
    attributes:
      label: 日志文件
      description: |
        上传项目的日志文件。日志能更直接的帮助开发者定位问题。

        若可以正常打开项目，请 [REPLACE] 导出日志压缩包并上传；若不能正常打开，请 [REPLACE] 找到日志并将其打包成压缩包上传。
    validations:
      accepted: ".zip,.rar,.7z,.gz,.tz,.tar"
  - type: textarea
    attributes:
      label: 错误详情与诊断信息
      description: |
        如果项目展示了错误弹窗，请将错误弹窗里的信息全部复制并粘贴到这里。

        如果项目不能展示错误弹窗，但仍能打开，请尝试 [REPLACE] 复制诊断信息到这里。

        诊断信息仅包含用于对你的运行环境进行诊断的基本信息，不包含任何隐私信息。除非你是专业用户，请不要以保护隐私为由改动提交的诊断信息。
      render: false
  - type: checkboxes
    id: callback
    attributes:
      label: 在提交前……
      description: 请回顾你所有的回答，如实回答这些问题。
      options:
        - label: 我确认我逐步完成了检查项，没有遗漏。
          required: true
        - label: 我确认上述的信息足够详细，以使开发者定位并修复此问题。
          required: true
        - label: 我了解如果我没有按照要求填写表单，它可能会被无条件关闭。
          required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: 协议
      description: 在提交 Issue 前，确保你完整阅读并了解了你享有的权利与应承担的义务、与开发者享有的权利与义务，
      options:
        - label: 我已经通读或至少了解了 [许可协议](https://github.com/MacroMeng/TurrisEburneaTemplate/blob/[REPLACE][BRANCH]/LICENSE)。我了解我享有的权利与应承担的义务、与开发者享有的权利与义务。
          required: true
